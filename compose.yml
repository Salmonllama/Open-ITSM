# Open ITSM: app, PostgreSQL and Caddy. Configure through .env (see .env.example).
name: open-itsm

services:
  app:
    image: ghcr.io/salmonllama/open-itsm:${OPEN_ITSM_VERSION:?set OPEN_ITSM_VERSION in .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://itsm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/itsm
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Links in Slack and Teams messages point to https://<APP_HOSTNAME>.
      APP_HOSTNAME: ${APP_HOSTNAME:?set APP_HOSTNAME in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - attachments:/data/attachments
      - backups:/data/backups
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U itsm -d itsm']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:?set APP_HOSTNAME in .env}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

configs:
  # Inline so an install needs only compose.yml and .env.
  # $$ escapes Compose interpolation; Caddy expands {$VAR} itself at startup.
  caddyfile:
    content: |
      {
      	{$$CADDY_GLOBAL_OPTIONS}
      }

      {$$APP_HOSTNAME} {
      	encode zstd gzip
        reverse_proxy app:3030 {
          header_up X-Forwarded-For {remote_ip}
        }
      }

networks:
  # PostgreSQL is reachable only from the app; it has no route to the host or internet.
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
  attachments:
  backups:
  caddy_data:
  caddy_config:
